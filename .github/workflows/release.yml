name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm exchange a GitHub OIDC token for a short-lived publish token (trusted publishing).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Publish to npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          if [[ -n "$(npm view "mographc@$version" version 2>/dev/null)" ]]; then
            echo "mographc@$version is already on npm."
            exit 0
          fi
          npm publish
